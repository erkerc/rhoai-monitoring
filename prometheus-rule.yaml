apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vllm-latency-alerts
  namespace: monitoring
spec:
  groups:
    - name: vllm-latency-alerts
      rules:
        - alert: VLLMHighAverageLatency
          expr: |
            (
              sum by (namespace, model_name) (
                rate(vllm:e2e_request_latency_seconds_sum[5m])
              )
              /
              sum by (namespace, model_name) (
                rate(vllm:e2e_request_latency_seconds_count[5m])
              )
            ) > 5
            and
            sum by (namespace, model_name) (
              rate(vllm:e2e_request_latency_seconds_count[5m])
            ) > 0
          for: 2m
          labels:
            severity: critical
            team: ml
          annotations:
            summary: "High average latency for vLLM ({{ $labels.model_name }})"
            description: |
              Average end-to-end latency > 5s for 5m.
              namespace="{{ $labels.namespace }}", model="{{ $labels.model_name }}"
              Current value: {{ printf "%.2f" $value }}s
